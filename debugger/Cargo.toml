[package]
name = "naive-debugger"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
repository = "https://github.com/Jozefpodlecki/naive-debugger"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.100"
pelite = "0.10.0"
iced-x86 = "1.21.0"
widestring = "1.0"
flexi_logger = "0.31.8"
log = "0.4.18"
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
	"Win32_UI_WindowsAndMessaging",
	"Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Wdk_System_Threading",  
] }
